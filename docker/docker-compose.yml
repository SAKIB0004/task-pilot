services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: taskpilot-api
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: taskpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: DB_NAME
      POSTGRES_USER: DATABASE_USER
      POSTGRES_PASSWORD: DATABASE_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DATABASE_USER -d DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: